<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page not found - Mikhail Buzumurga</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css?v=2">
    <style>
        .notfound { min-height: 100vh; display: grid; place-items: center; text-align: center; padding: 24px; }
        .notfound h1 { font-size: clamp(4rem, 16vw, 9rem); }
        .notfound p { color: var(--muted); margin: 12px 0 32px; }
    </style>
</head>
<body>
    <main class="notfound">
        <div>
            <h1>404</h1>
            <p>This page doesn't exist or has been moved.</p>
            <a class="btn btn--solid" href="/">Go to homepage</a>
        </div>
    </main>
</body>
</html>
