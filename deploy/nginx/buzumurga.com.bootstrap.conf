# buzumurga.com - temporary HTTP-only config, used BEFORE the certificate exists:
#   1) to test the site with curl --resolve before DNS is switched;
#   2) to pass the certbot HTTP-01 challenge right after DNS is switched.
# Then replace it with buzumurga.com.conf.
limit_req_zone $binary_remote_addr zone=buzumurga_contact:1m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name buzumurga.com www.buzumurga.com buzumur.ga www.buzumur.ga;

    root /var/www/buzumurga.com;
    index index.html;
    charset utf-8;
    server_tokens off;

    include /etc/nginx/snippets/buzumurga-blocklist.conf;
    include /etc/nginx/snippets/buzumurga-security-headers.conf;

    error_page 404 /404.html;
    location = /404.html { internal; }

    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location ~ /\.(?!well-known/) { deny all; }
    location ~* \.(md|log|json|env|mjs)$ { deny all; }

    location = /api/contact {
        limit_except POST { deny all; }
        limit_req zone=buzumurga_contact burst=3 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / { try_files $uri $uri/ =404; }
}
