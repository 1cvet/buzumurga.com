# xfluxdev.com (old Extra Flow site) - every URL redirects to the freelance page on buzumurga.com.
# Install only after the DNS of xfluxdev.com points to this server (see deploy/XFLUXDEV.md):
#   /etc/nginx/sites-available/xfluxdev.com.conf + symlink in sites-enabled.
# Always back up /etc/nginx and run `nginx -t` before `systemctl reload nginx`.

# HTTP: ACME challenges (shared webroot), everything else -> the new page
server {
    listen 80;
    listen [::]:80;
    server_name xfluxdev.com www.xfluxdev.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://buzumurga.com/ru/freelance/;
    }
}

# HTTPS: needs the certificate (certbot certonly --webroot -w /var/www/html -d xfluxdev.com -d www.xfluxdev.com).
# Until it exists, keep this block commented out.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xfluxdev.com www.xfluxdev.com;

    ssl_certificate     /etc/letsencrypt/live/xfluxdev.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xfluxdev.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    server_tokens off;
    access_log /var/log/nginx/xfluxdev.com.access.log;

    location / {
        return 301 https://buzumurga.com/ru/freelance/;
    }
}
