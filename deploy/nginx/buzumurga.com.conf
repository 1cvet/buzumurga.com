# buzumurga.com - final config (after the Let's Encrypt certificate exists).
# Install: /etc/nginx/sites-available/buzumurga.com.conf + symlink in sites-enabled.
# Snippets go to /etc/nginx/snippets/. Always `nginx -t` before `systemctl reload nginx`.
# Adjust before use, following the audit:
#   - remove the [::] listen lines if the server has no IPv6;
#   - on Nginx >= 1.25.1 replace "listen 443 ssl http2" with "listen 443 ssl" + "http2 on;".

# HTTP: ACME challenges, everything else -> HTTPS apex
server {
    listen 80;
    listen [::]:80;
    server_name buzumurga.com www.buzumurga.com buzumur.ga www.buzumur.ga;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://buzumurga.com$request_uri;
    }
}

# HTTPS: www and the old domain -> apex
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.buzumurga.com buzumur.ga www.buzumur.ga;

    ssl_certificate     /etc/letsencrypt/live/buzumurga.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buzumurga.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    return 301 https://buzumurga.com$request_uri;
}

# HTTPS: the site
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name buzumurga.com;

    ssl_certificate     /etc/letsencrypt/live/buzumurga.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/buzumurga.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/buzumurga.com;
    index index.html;
    charset utf-8;
    server_tokens off;

    access_log /var/log/nginx/buzumurga.com.access.log;
    error_log  /var/log/nginx/buzumurga.com.error.log warn;

    include /etc/nginx/snippets/buzumurga-blocklist.conf;

    add_header Strict-Transport-Security "max-age=15552000" always;
    include /etc/nginx/snippets/buzumurga-security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;
    # brotli on; brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml;  # only if ngx_brotli is installed

    error_page 404 /404.html;
    location = /404.html { internal; }

    # no dot files (except ACME), no source/log/data files
    location ~ /\.(?!well-known/) { deny all; }
    location ~* \.(md|log|json|env|mjs)$ { deny all; }

    # fingerprinted assets: cache forever
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        include /etc/nginx/snippets/buzumurga-security-headers.conf;
        access_log off;
        try_files $uri =404;
    }

    # stable URLs (CV, certificates, icons, OG images): cache for a week
    location ~* \.(pdf|jpg|jpeg|png|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=604800" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        include /etc/nginx/snippets/buzumurga-security-headers.conf;
        try_files $uri =404;
    }

    # the old site linked the Word CV
    location = /Buzumurga_Mikhail.docx { return 301 /Buzumurga_Mikhail.pdf; }

    # pages: always revalidate
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=15552000" always;
        include /etc/nginx/snippets/buzumurga-security-headers.conf;
        try_files $uri $uri/ =404;
    }
}
